
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 155" width="700">
  <rect width="700" height="155" rx="8" fill="#0d1117"/>

  <defs>
    <pattern id="grid" width="17" height="17" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="13" height="13" rx="2" fill="#161b22"/>
    </pattern>
    <pattern id="green" width="17" height="17" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="13" height="13" rx="2" fill="#238636"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="680" height="135" fill="url(#grid)"/>
  <rect x="10" y="10" width="680" height="135" fill="url(#green)" opacity="0.9"/>

  <g>
    <rect x="18" y="18" width="13" height="13" rx="2" fill="#39d353">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="35" y="18" width="13" height="13" rx="2" fill="#26a641"/>
    <rect x="52" y="18" width="13" height="13" rx="2" fill="#39d353"/>
    <rect x="69" y="18" width="13" height="13" rx="2" fill="#0e4429"/>
  </g>

  <g id="snake">
    <rect x="18" y="18" width="13" height="13" rx="3" fill="#ffffff"/>
    <rect x="35" y="18" width="13" height="13" rx="3" fill="#7ee787"/>
    <rect x="52" y="18" width="13" height="13" rx="3" fill="#7ee787"/>
    <rect x="69" y="18" width="13" height="13" rx="3" fill="#7ee787"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 119,34; 238,68; 357,34; 476,68; 595,102; 0,0"
      dur="18s" repeatCount="indefinite"/>
  </g>

  <text x="350" y="140" font-family="monospace" font-size="10"
        fill="#8b949e" text-anchor="middle">CUSTOM SNAKE • VISUAL DEMO</text>
</svg>
